<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120f08">
<title>Un camino de girasoles para ti 💛</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080704;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 65%,rgba(85,60,20,.25),rgba(0,0,0,.97) 60%);z-index:5;color:white;text-align:center;padding:24px}
#gate .box{max-width:420px}
#gate .small{letter-spacing:.22em;text-transform:uppercase;font-size:12px;opacity:.7}
#gate h1{font-family:Georgia,serif;font-size:38px;margin:10px 0 8px;font-weight:500}
#gate p{opacity:.76;line-height:1.5}
#gate button{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.1);color:white;border-radius:999px;padding:14px 26px;font-size:16px;margin-top:12px}
#sound,#replay{position:fixed;z-index:4;top:16px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.3);color:white;font-size:18px}
#sound{right:16px}#replay{left:16px}
#caption{position:fixed;left:8%;right:8%;bottom:11%;z-index:3;color:#fff;text-align:center;font-family:Georgia,serif;font-size:clamp(22px,6vw,38px);text-shadow:0 3px 18px rgba(0,0,0,.8);opacity:0;transition:opacity 1s}
#hint{position:fixed;left:0;right:0;bottom:3%;z-index:3;color:rgba(255,255,255,.7);text-align:center;font-size:12px;letter-spacing:.08em;opacity:0;transition:opacity 1s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="caption"></div>
<div id="hint">Una sola historia, de principio a fin 🌻</div>
<button id="replay" aria-label="Repetir">↻</button><button id="sound" aria-label="Sonido">♪</button>
<div id="gate"><div class="box"><div class="small">Una pequeña historia</div><h1>Toca para comenzar</h1><p>Preparé un camino de girasoles para ti. Activa el sonido y deja que todo florezca.</p><button id="start">Comenzar 💛</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});
const gate=document.getElementById('gate'),cap=document.getElementById('caption'),hint=document.getElementById('hint');
const soundBtn=document.getElementById('sound'), replay=document.getElementById('replay');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,1.5),started=false,startTime=0,muted=false,audio=null;
function resize(){W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const rand=n=>{let t=Math.sin(n*999.91)*43758.5453;return t-Math.floor(t)}
const clamp=v=>Math.max(0,Math.min(1,v)), smooth=v=>{v=clamp(v);return v*v*(3-2*v)}, range=(t,a,b)=>clamp((t-a)/(b-a));
function flower(px,py,s,open=1,wind=0,alpha=1){
 x.save();x.globalAlpha=alpha;
 x.strokeStyle='#244516';x.lineWidth=Math.max(1,s*.08);x.beginPath();x.moveTo(px,py+s*1.8);x.quadraticCurveTo(px+wind*s*.3,py+s*.9,px,py);x.stroke();
 x.translate(px,py);x.rotate(wind*.08);
 const petals=18; for(let i=0;i<petals;i++){x.save();x.rotate(i*Math.PI*2/petals);x.scale(open,open);x.fillStyle=i%2?'#e6a916':'#f2bd24';x.beginPath();x.ellipse(0,-s*.62,s*.18,s*.5,0,0,Math.PI*2);x.fill();x.restore()}
 x.fillStyle='#5b3514';x.beginPath();x.arc(0,0,s*.34,0,Math.PI*2);x.fill();
 x.fillStyle='#2b1b0b';for(let i=0;i<34;i++){let a=i*2.4,r=Math.sqrt(i/34)*s*.28;x.beginPath();x.arc(Math.cos(a)*r,Math.sin(a)*r,s*.025,0,7);x.fill()}
 x.restore()
}
function leaf(px,py,s,flip=1){x.save();x.translate(px,py);x.rotate(flip*.5);x.fillStyle='#315d22';x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(flip*s*.65,-s*.22,flip*s,0);x.quadraticCurveTo(flip*s*.55,s*.35,0,0);x.fill();x.restore()}
function sky(t){
 let g=x.createLinearGradient(0,0,0,H);let day=smooth(range(t,10,28));
 g.addColorStop(0,`rgb(${Math.round(10+70*day)},${Math.round(9+95*day)},${Math.round(16+125*day)})`);
 g.addColorStop(.65,`rgb(${Math.round(20+190*day)},${Math.round(14+145*day)},${Math.round(8+80*day)})`);
 g.addColorStop(1,`rgb(${Math.round(8+105*day)},${Math.round(7+65*day)},${Math.round(4+30*day)})`);
 x.fillStyle=g;x.fillRect(0,0,W,H);
 if(day>.05){x.globalAlpha=day*.9;x.fillStyle='#ffd47a';x.beginPath();x.arc(W*.78,H*.24,Math.max(20,W*.055),0,7);x.fill();x.globalAlpha=1}
}
const field=[];for(let i=0;i<180;i++){field.push({z:8+rand(i)*92,side:rand(i+2)<.5?-1:1,lane:.8+rand(i+4)*5.8,h:.75+rand(i+8)*1.45,seed:i})}
function drawField(t){
 const walk=range(t,23,72)*70; const horizon=H*.43;
 x.fillStyle='#6f5227';x.fillRect(0,horizon,W,H-horizon);
 x.fillStyle='#b28a52';x.beginPath();x.moveTo(W*.46,horizon);x.lineTo(W*.54,horizon);x.lineTo(W*.82,H);x.lineTo(W*.18,H);x.closePath();x.fill();
 x.strokeStyle='rgba(55,38,18,.22)';x.lineWidth=1;for(let i=0;i<14;i++){let yy=horizon+(H-horizon)*i/14;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}
 let visible=[];
 for(const f of field){let z=f.z-walk;if(z<1||z>65)continue; let p=1/z; let sc=Math.min(1.7,6*p);let center=W*.5+Math.sin((walk+z)*.05)*W*.025;let px=center+f.side*(W*(.06+f.lane*.06))*sc;let py=horizon+(H-horizon)*(1- z/65)**1.55;let size=(20+f.h*28)*sc*(W/390);visible.push({z,px,py,size,f})}
 visible.sort((a,b)=>b.z-a.z);
 for(const q of visible){let open=.72+.28*smooth(range(9-q.z,0,8));let w=Math.sin(t*1.7+q.f.seed)*.18;flower(q.px,q.py,q.size,open,w,clamp(1-(q.z-52)/15))}
}
function drawSeed(t){
 x.fillStyle='#2b1c0e';x.fillRect(0,0,W,H);
 let cx=W/2,cy=H*.62;
 x.fillStyle='#3c250f';for(let i=0;i<25;i++){x.beginPath();x.arc(rand(i)*W, H*.5+rand(i+1)*H*.5,1+rand(i+2)*4,0,7);x.fill()}
 x.save();x.translate(cx,cy);x.rotate(-.35);x.fillStyle='#6d4c26';x.beginPath();x.ellipse(0,0,16,9,0,0,7);x.fill();x.restore();
 x.strokeStyle='#e6d3a3';x.lineCap='round';
 for(let r=0;r<5;r++){let q=smooth(range(t,2+r*.4,6+r*.5));x.lineWidth=2.3-r*.25;x.beginPath();x.moveTo(cx,cy+3);for(let j=1;j<=12;j++){let yy=cy+q*j*9,xx=cx+Math.sin(j*.8+r)*q*(9+r*3);x.lineTo(xx,yy)}x.stroke()}
}
function drawSprout(t){
 let rise=smooth(range(t,7,23));sky(t);x.fillStyle='#5b4021';x.fillRect(0,H*.62,W,H*.38);
 let cx=W/2,base=H*.64,stem=H*.31*rise;
 x.strokeStyle='#315c23';x.lineWidth=7;x.beginPath();x.moveTo(cx,base);x.quadraticCurveTo(cx+Math.sin(t)*8,base-stem*.55,cx,base-stem);x.stroke();
 if(rise>.25){leaf(cx,base-stem*.55,30*smooth(range(rise,.25,.65)),-1);leaf(cx,base-stem*.38,26*smooth(range(rise,.4,.75)),1)}
 let open=smooth(range(t,15,23));flower(cx,base-stem,38+open*32,open,.06*Math.sin(t*2));
}
function drawHero(t){
 drawField(t);let p=smooth(range(t,67,84));let sz=(50+140*p)*(W/390);let px=W*.5,py=H*.43+H*.15*(1-p);flower(px,py,sz,.72+.28*p,Math.sin(t)*.05);
}
function drawHeart(t){
 sky(40);x.fillStyle='#5b4623';x.fillRect(0,H*.38,W,H*.62);
 const p=smooth(range(t,84,94));let scale=Math.min(W,H)*.027;
 for(let i=0;i<90;i++){let a=i/90*Math.PI*2;let hx=16*Math.pow(Math.sin(a),3);let hy=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);let px=W/2+hx*scale*.55,py=H*.57-hy*scale*.45;flower(px,py,6+5*p,1,Math.sin(t+i)*.08,p)}
}
const phrases=[
 [6,12,'Todo empezó con algo pequeño…'],
 [18,25,'Y poco a poco, todo fue floreciendo.'],
 [37,47,'Entre tantos caminos, siempre elegiría caminar contigo.'],
 [59,68,'Hay amores que no se explican. Se cultivan.'],
 [86,99,'21 de septiembre, Feliz día del Amor 💛']
];
function caption(t){let text='',op=0;for(const [a,b,s] of phrases)if(t>=a&&t<=b){text=s;op=Math.min(smooth(range(t,a,a+1.4)),smooth(range(b-t,0,1.4)));break}cap.textContent=text;cap.style.opacity=op}
function frame(now){if(!started)return;let t=(now-startTime)/1000;if(t>99)t=99;
 if(t<7)drawSeed(t); else if(t<23)drawSprout(t); else if(t<67)drawField(t); else if(t<84)drawHero(t); else drawHeart(t);
 caption(t);hint.style.opacity=(t>24&&t<33)?.8:0;requestAnimationFrame(frame)}
function audioStart(){
 try{let A=window.AudioContext||window.webkitAudioContext;audio=new A();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=174;g.gain.value=.025;o.connect(g).connect(audio.destination);o.start();
 let b=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);let d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.16;let s=audio.createBufferSource(),f=audio.createBiquadFilter(),gg=audio.createGain();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=700;gg.gain.value=.05;s.connect(f).connect(gg).connect(audio.destination);s.start();audio.nodes=[g,gg]}catch(e){}
}
function start(){gate.style.display='none';started=true;startTime=performance.now();audioStart();requestAnimationFrame(frame)}
document.getElementById('start').onclick=start;gate.onclick=e=>{if(e.target===gate)start()}
soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=muted?'×':'♪';if(audio?.nodes)audio.nodes.forEach((n,i)=>n.gain.value=muted?0:(i===0?.025:.05))}
replay.onclick=()=>{startTime=performance.now();cap.style.opacity=0}
</script>
</body></html>
